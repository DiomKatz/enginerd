<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <title>DPilot field computer layout</title>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#37474F"/>
    </marker>
    <marker id="arrB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#0288D1"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2E7D32"/>
    </marker>
    <style>
      .zone-label { font-size: 13px; font-weight: 700; letter-spacing: 1.5px; }
      .title { font-size: 16px; font-weight: 700; fill: #1F2D33; }
      .sub { font-size: 12px; fill: #5F7079; }
      .item { font-size: 13px; fill: #263238; }
      .small { font-size: 13px; font-weight: 600; fill: #263238; }
      .link { font-size: 12px; fill: #37474F; }
      .linkB { font-size: 12px; fill: #0277BD; font-weight: 600; }
      .linkG { font-size: 12px; fill: #2E7D32; font-weight: 600; }
      .box { fill: #FFFFFF; stroke: #90A4AE; stroke-width: 1.2; }
      .core { fill: #FFFFFF; stroke: #7B1FA2; stroke-width: 2; }
      .gbox { fill: #FFFFFF; stroke: #9575CD; stroke-width: 1.2; }
      .line { stroke: #37474F; stroke-width: 1.6; fill: none; }
    </style>
  </defs>

  <!-- ===== Field computer zone ===== -->
  <rect x="15" y="15" width="640" height="530" rx="16" fill="#F4EFFA" stroke="#9575CD" stroke-width="1.5"/>
  <text x="35" y="42" class="zone-label" fill="#7B1FA2">DPILOT FIELD COMPUTER</text>
  <text x="35" y="60" class="sub">3D-printed case on the pilot's RC transmitter · replaces the laptop in the field</text>

  <!-- Touchscreen -->
  <rect x="40" y="85" width="210" height="160" rx="8" class="box"/>
  <rect x="52" y="97" width="34" height="24" rx="2" fill="#263238"/>
  <rect x="55" y="100" width="28" height="15" fill="#1E5F3A"/>
  <rect x="55" y="116" width="28" height="3" fill="#50AAFF"/>
  <text x="96" y="108" class="small">3.5" touchscreen</text>
  <text x="96" y="124" class="sub">480 × 320</text>
  <text x="52" y="152" class="item">• STATUS: horizon, speed,</text>
  <text x="63" y="170" class="item">battery, link</text>
  <text x="52" y="192" class="item">• MISSION · MAP</text>
  <text x="52" y="214" class="item">• CAL · DRONE setup tools</text>

  <!-- Speaker -->
  <rect x="40" y="265" width="210" height="62" rx="8" class="box"/>
  <text x="145" y="291" text-anchor="middle" class="small">Speaker</text>
  <text x="145" y="310" text-anchor="middle" class="sub">spoken call-outs</text>

  <!-- Storage -->
  <rect x="40" y="347" width="210" height="80" rx="8" class="box"/>
  <text x="145" y="373" text-anchor="middle" class="small">SD card</text>
  <text x="145" y="392" text-anchor="middle" class="sub">missions, offline satellite</text>
  <text x="145" y="408" text-anchor="middle" class="sub">map tiles, link logs</text>

  <!-- Pi -->
  <rect x="300" y="85" width="330" height="320" rx="12" class="core"/>
  <text x="320" y="113" class="title">Raspberry Pi Zero 2W</text>
  <text x="320" y="131" class="sub">field-station app · headless, no desktop</text>
  <text x="320" y="164" class="item">• Live status from the telemetry link</text>
  <text x="320" y="188" class="item">• Pick a mission, send the geofence,</text>
  <text x="331" y="206" class="item">start and stop</text>
  <text x="320" y="230" class="item">• Satellite map with the live track</text>
  <text x="320" y="254" class="item">• Edit waypoints in the field</text>
  <text x="320" y="278" class="item">• Spoken alerts and call-outs</text>
  <text x="320" y="302" class="item">• Drone Wi-Fi and software control</text>
  <text x="320" y="326" class="item">• Bench calibration of the drone board</text>
  <text x="320" y="366" class="sub">same telemetry and command code as the</text>
  <text x="320" y="382" class="sub">desktop ground station</text>

  <line x1="300" y1="165" x2="254" y2="165" class="line" marker-end="url(#arr)"/>
  <line x1="300" y1="296" x2="254" y2="296" class="line" marker-end="url(#arr)"/>
  <line x1="300" y1="387" x2="254" y2="387" class="line" marker-start="url(#arr)" marker-end="url(#arr)"/>

  <!-- Base ESP32 -->
  <rect x="300" y="440" width="330" height="80" rx="8" class="gbox"/>
  <text x="465" y="470" text-anchor="middle" class="small">Base-station ESP32 + LoRa</text>
  <text x="465" y="490" text-anchor="middle" class="sub">plugged into the Pi over USB</text>
  <line x1="465" y1="440" x2="465" y2="409" class="line" marker-start="url(#arr)" marker-end="url(#arr)"/>
  <text x="473" y="429" class="link">USB serial</text>

  <!-- ===== Outside ===== -->
  <rect x="700" y="70" width="280" height="100" rx="12" class="gbox"/>
  <text x="840" y="102" text-anchor="middle" class="small">Desktop mission planner</text>
  <text x="840" y="122" text-anchor="middle" class="sub">optional: plans missions at home</text>
  <text x="840" y="139" text-anchor="middle" class="sub">and prepares the map tiles</text>
  <line x1="696" y1="120" x2="634" y2="120" class="line" stroke-dasharray="3 4" marker-end="url(#arr)"/>
  <text x="678" y="112" text-anchor="middle" class="sub" font-size="11">files</text>

  <rect x="700" y="230" width="280" height="120" rx="12" fill="#EAF7FC" stroke="#1CB5E0" stroke-width="1.5"/>
  <text x="840" y="264" text-anchor="middle" class="title">DPilot vehicle</text>
  <text x="840" y="286" text-anchor="middle" class="sub">aircraft or boat</text>
  <text x="840" y="303" text-anchor="middle" class="sub">ESP32 board + Raspberry Pi</text>
  <text x="840" y="320" text-anchor="middle" class="sub">companion computer</text>

  <!-- Wi-Fi (ground link only) -->
  <line x1="634" y1="270" x2="696" y2="270" stroke="#2E7D32" stroke-width="1.8" stroke-dasharray="2 4" marker-start="url(#arrG)" marker-end="url(#arrG)"/>
  <text x="704" y="208" class="linkG">Wi-Fi (on the ground only)</text>
  <text x="704" y="223" class="sub" font-size="11">setup, start / stop, live view</text>

  <!-- LoRa (flight link) -->
  <polyline points="634,480 840,480 840,354" fill="none" stroke="#0288D1" stroke-width="1.8" stroke-dasharray="6 4" marker-start="url(#arrB)" marker-end="url(#arrB)"/>
  <text x="852" y="400" class="linkB">LoRa 915 MHz</text>
  <text x="852" y="416" class="linkB">encrypted, hopping</text>
  <text x="852" y="434" class="link">↓ telemetry ↑ missions</text>
</svg>
