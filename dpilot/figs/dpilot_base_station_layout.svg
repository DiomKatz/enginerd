<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <title>DPilot base station layout</title>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#37474F"/>
    </marker>
    <marker id="arrB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#0288D1"/>
    </marker>
    <marker id="arrP" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7B1FA2"/>
    </marker>
    <style>
      .zone-label { font-size: 13px; font-weight: 700; letter-spacing: 1.5px; }
      .title { font-size: 16px; font-weight: 700; fill: #1F2D33; }
      .sub { font-size: 12px; fill: #5F7079; }
      .item { font-size: 13px; fill: #263238; }
      .small { font-size: 13px; font-weight: 600; fill: #263238; }
      .link { font-size: 12px; fill: #37474F; }
      .linkB { font-size: 12px; fill: #0277BD; font-weight: 600; }
      .linkP { font-size: 12px; fill: #6A1B9A; font-weight: 600; }
      .box { fill: #FFFFFF; stroke: #90A4AE; stroke-width: 1.2; }
      .core { fill: #FFFFFF; stroke: #7B1FA2; stroke-width: 2; }
      .gbox { fill: #FFFFFF; stroke: #9575CD; stroke-width: 1.2; }
      .line { stroke: #37474F; stroke-width: 1.6; fill: none; }
    </style>
  </defs>

  <!-- ===== Field computer zone ===== -->
  <rect x="15" y="15" width="640" height="530" rx="16" fill="#F4EFFA" stroke="#9575CD" stroke-width="1.5"/>
  <text x="35" y="42" class="zone-label" fill="#7B1FA2">DPILOT BASE STATION</text>
  <text x="35" y="60" class="sub">3D-printed enclosure clipped onto the pilot's RC transmitter</text>

  <!-- TFT -->
  <rect x="40" y="85" width="210" height="150" rx="8" class="box"/>
  <rect x="52" y="97" width="22" height="30" rx="2" fill="#263238"/>
  <rect x="55" y="104" width="16" height="9" fill="#1E88E5"/>
  <rect x="55" y="113" width="16" height="9" fill="#8D6E63"/>
  <text x="84" y="110" class="small">Colour TFT</text>
  <text x="84" y="126" class="sub">240 × 320</text>
  <text x="52" y="157" class="item">• Speed and altitude</text>
  <text x="52" y="179" class="item">• Artificial horizon or</text>
  <text x="63" y="197" class="item">G-G acceleration diagram</text>
  <text x="52" y="219" class="item">• Status, compass, battery</text>

  <!-- OLED -->
  <rect x="40" y="260" width="210" height="130" rx="8" class="box"/>
  <rect x="52" y="272" width="30" height="16" rx="2" fill="#263238"/>
  <line x1="56" y1="277" x2="76" y2="277" stroke="#8CE1FF" stroke-width="1.5"/>
  <line x1="56" y1="282" x2="70" y2="282" stroke="#8CE1FF" stroke-width="1.5"/>
  <text x="92" y="285" class="small">OLED 128 × 64</text>
  <text x="52" y="313" class="item">• Link latency and RSSI</text>
  <text x="52" y="335" class="item">• Packet counters</text>
  <text x="52" y="357" class="item">• Hopping channel</text>
  <text x="52" y="379" class="item">• GPS satellites, data line</text>

  <!-- ESP32 board -->
  <rect x="300" y="85" width="330" height="305" rx="12" class="core"/>
  <text x="320" y="113" class="title">ESP32 LoRa board</text>
  <text x="320" y="131" class="sub">same firmware as the aircraft · base-station role</text>
  <text x="320" y="131" class="sub" dy="16">selected automatically (no IMU fitted)</text>
  <text x="320" y="180" class="item">• Receives and decrypts telemetry</text>
  <text x="320" y="204" class="item">• Drives both displays live</text>
  <text x="320" y="228" class="item">• Forwards telemetry over USB</text>
  <text x="320" y="252" class="item">• Uplinks mission commands</text>
  <text x="320" y="276" class="item">• Follows the frequency-hopping link</text>
  <text x="320" y="300" class="item">• Monitors link quality</text>
  <text x="320" y="324" class="item">• Reports the base GPS position</text>
  <text x="320" y="364" class="sub">LoRa radio and antenna on board</text>

  <line x1="300" y1="160" x2="254" y2="160" class="line" marker-end="url(#arr)"/>
  <line x1="300" y1="325" x2="254" y2="325" class="line" marker-end="url(#arr)"/>

  <!-- GPS + USB -->
  <rect x="300" y="430" width="155" height="80" rx="8" class="box"/>
  <text x="377" y="462" text-anchor="middle" class="small">GPS receiver</text>
  <text x="377" y="482" text-anchor="middle" class="sub">base position</text>
  <line x1="377" y1="430" x2="377" y2="394" class="line" marker-end="url(#arr)"/>

  <rect x="475" y="430" width="155" height="80" rx="8" class="box"/>
  <text x="552" y="462" text-anchor="middle" class="small">USB</text>
  <text x="552" y="482" text-anchor="middle" class="sub">to the field computer / laptop</text>
  <line x1="552" y1="430" x2="552" y2="394" class="line" marker-start="url(#arr)" marker-end="url(#arr)"/>

  <!-- ===== Outside ===== -->
  <rect x="700" y="70" width="280" height="110" rx="12" fill="#EAF7FC" stroke="#1CB5E0" stroke-width="1.5"/>
  <text x="840" y="105" text-anchor="middle" class="title">DPilot aircraft</text>
  <text x="840" y="127" text-anchor="middle" class="sub">ESP32 flight board +</text>
  <text x="840" y="144" text-anchor="middle" class="sub">Raspberry Pi companion computer</text>

  <rect x="700" y="250" width="280" height="110" rx="12" class="gbox"/>
  <text x="840" y="283" text-anchor="middle" class="small">Pilot RC transmitter</text>
  <text x="840" y="303" text-anchor="middle" class="sub">2.4 GHz straight to the aircraft</text>
  <text x="840" y="320" text-anchor="middle" class="sub">mode switch: manual / assisted / auto</text>
  <text x="840" y="337" text-anchor="middle" class="sub">manual takeover at any time</text>

  <rect x="700" y="415" width="280" height="110" rx="12" class="gbox"/>
  <text x="840" y="447" text-anchor="middle" class="small">Field computer or laptop</text>
  <text x="840" y="467" text-anchor="middle" class="sub">map-based mission planning, geofences,</text>
  <text x="840" y="484" text-anchor="middle" class="sub">live telemetry, flight logs and debrief</text>

  <!-- LoRa link -->
  <polyline points="634,150 668,150 668,125 696,125" fill="none" stroke="#0288D1" stroke-width="1.8" stroke-dasharray="6 4" marker-start="url(#arrB)" marker-end="url(#arrB)"/>
  <text x="700" y="200" class="linkB">LoRa 915 MHz, encrypted, hopping</text>
  <text x="700" y="217" class="link">↓ telemetry   ↑ missions</text>

  <!-- RC link -->
  <line x1="940" y1="250" x2="940" y2="184" stroke="#7B1FA2" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrP)"/>
  <text x="932" y="236" text-anchor="end" class="linkP">2.4 GHz RC</text>

  <!-- mounted on -->
  <line x1="655" y1="305" x2="700" y2="305" stroke="#9575CD" stroke-width="3"/>
  <text x="679" y="294" text-anchor="middle" class="sub" font-size="11">clips on</text>

  <!-- USB to laptop -->
  <line x1="630" y1="470" x2="696" y2="470" class="line" marker-start="url(#arr)" marker-end="url(#arr)"/>
</svg>
